<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>קטלוג קישורים</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

    <h1>📚 קטלוג קישורים</h1>

    <div class="note">
        רשימת כל הקישורים במערכת (לצפייה בלבד).
    </div>

    <input
        id="search"
        type="text"
        placeholder="חיפוש..."
    >

    <p id="count"></p>

    <div id="links"></div>

</div>

<div id="toast"></div>

<script>

async function loadLinks(){

    // מונע קריאה מה-cache
    const response = await fetch(`links.json?t=${Date.now()}`, {
        cache: "no-store"
    });

    const json = await response.json();
    const entries = Object.entries(json);

    const container = document.getElementById("links");
    const counter = document.getElementById("count");
    const search = document.getElementById("search");

    function render(filter = ""){

        container.innerHTML = "";

        const list = entries.filter(([key, value]) => {
            const text = (key + " " + value.url).toLowerCase();
            return text.includes(filter.toLowerCase());
        });

        counter.textContent = `${list.length} קישורים`;

        list.sort((a, b) => a[0].localeCompare(b[0]));

        for (const [key, value] of list){

            const shortPath = `/${key}`;
            const shortUrl  = `\( {location.origin} \){shortPath}`;

            const card = document.createElement("div");
            card.className = "card";

            // כותרת - הנתיב הקצר
            const title = document.createElement("h3");
            title.textContent = shortPath;
            card.appendChild(title);

            // כתובת מלאה של הקישור המקוצר
            const fullShort = document.createElement("p");
            fullShort.innerHTML = `<strong>קישור מקוצר:</strong><br>`;
            const shortLinkText = document.createElement("span");
            shortLinkText.textContent = shortUrl;
            fullShort.appendChild(shortLinkText);
            card.appendChild(fullShort);

            // כתובת היעד
            const target = document.createElement("p");
            target.innerHTML = `<strong>יעד:</strong><br>`;
            const targetText = document.createElement("span");
            targetText.textContent = value.url;
            target.appendChild(targetText);
            card.appendChild(target);

            // כפתור פתח קישור מקוצר
            const btnShort = document.createElement("a");
            btnShort.className = "btn-link";
            btnShort.href = shortPath;
            btnShort.target = "_blank";
            btnShort.textContent = "פתח קישור";
            card.appendChild(btnShort);

            // כפתור פתח יעד
            const btnTarget = document.createElement("a");
            btnTarget.className = "btn-link";
            btnTarget.href = value.url;
            btnTarget.target = "_blank";
            btnTarget.textContent = "פתח יעד";
            card.appendChild(btnTarget);

            // כפתור העתק יעד
            const btnCopy = document.createElement("a");
            btnCopy.className = "btn-link copy";
            btnCopy.href = "#";
            btnCopy.textContent = "העתק יעד";
            btnCopy.onclick = (e) => {
                e.preventDefault();
                navigator.clipboard.writeText(value.url);
                showToast("הועתק");
            };
            card.appendChild(btnCopy);

            container.appendChild(card);
        }
    }

    search.oninput = () => render(search.value);
    render();
}

function showToast(text){
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 1500);
}

loadLinks();

</script>

</body>
</html>
