<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>קטלוג קישורים</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

    <h1>📚 קטלוג קישורים</h1>

    <div class="note">
        רשימת כל הקישורים במערכת (לצפייה בלבד).
    </div>

    <input
        id="search"
        type="text"
        placeholder="חיפוש..."
    >

    <p id="count"></p>

    <div id="links"></div>

</div>

<div id="toast"></div>

<script>

async function loadLinks(){

    // מונע קריאה מה-cache
    const response = await fetch(`links.json?t=${Date.now()}`, {
        cache: "no-store"
    });

    const json = await response.json();

    const entries = Object.entries(json);

    const container = document.getElementById("links");
    const counter = document.getElementById("count");
    const search = document.getElementById("search");

    function render(filter=""){

        container.innerHTML="";

        const list = entries.filter(([key,value])=>{

            const text=(key+" "+value.url).toLowerCase();

            return text.includes(filter.toLowerCase());

        });

        counter.textContent=`${list.length} קישורים`;

        list.sort((a,b)=>a[0].localeCompare(b[0]));

        for(const [key,value] of list){

            const shortUrl = `\( {location.origin}/ \){key}`;

            const card=document.createElement("div");

            card.className="card";

            card.innerHTML=`

                <h3>${shortUrl}</h3>

                <p><strong>יעד:</strong><br>${value.url}</p>

                <a class="btn-link"
                   href="${shortUrl}"
                   target="_blank">
                   פתח קישור
                </a>

                <a class="btn-link"
                   href="${value.url}"
                   target="_blank">
                   פתח יעד
                </a>

                <a class="btn-link copy"
                   href="#">
                   העתק יעד
                </a>

            `;

            card.querySelector(".copy").onclick=(e)=>{

                e.preventDefault();

                navigator.clipboard.writeText(value.url);

                showToast("הועתק");

            };

            container.appendChild(card);

        }

    }

    search.oninput=()=>render(search.value);

    render();

}

function showToast(text){

    const toast=document.getElementById("toast");

    toast.textContent=text;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },1500);

}

loadLinks();

</script>

</body>
</html>
