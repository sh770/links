<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>קטלוג קישורים</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="style.css">

<style>
  /* מרכוז כותרת + חיפוש */
  .wrap {
    text-align: center;
  }
  .wrap h1 {
    margin-bottom: 8px;
  }
  .note {
    display: inline-block;
    text-align: center;
    max-width: 100%;
  }
  #search {
    max-width: 360px;
    margin: 16px auto 8px;
    display: block;
    text-align: center;
  }
  #count {
    margin: 8px 0 20px;
    color: var(--text-dim);
  }

  /* כרטיסים */
  .card {
    text-align: center;
  }
  .card p {
    margin: 12px 0;
    word-break: break-all;
    line-height: 1.5;
  }
  .card strong {
    color: var(--text-dim);
    font-size: 13px;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }

  .card-actions .btn-link {
    margin-top: 0;
    padding: 9px 16px;
    font-size: 13.5px;
    border-radius: 10px;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* כפתורי פתיחה */
  .card-actions .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .card-actions .btn-primary:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  /* כפתורי העתקה */
  .card-actions .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .card-actions .btn-secondary:hover {
    background: var(--border);
    border-color: #3a4050;
    transform: translateY(-1px);
  }
</style>
</head>

<body>

<div class="wrap">

    <h1>📚 קטלוג קישורים</h1>

    <div class="note">
        רשימת כל הקישורים במערכת (לצפייה בלבד).
    </div>

    <input
        id="search"
        type="text"
        placeholder="חיפוש..."
    >

    <p id="count"></p>

    <div id="links"></div>

</div>

<div id="toast"></div>

<script>

async function loadLinks(){

    const response = await fetch("links.json?t=" + Date.now(), {
        cache: "no-store"
    });

    const json = await response.json();
    const entries = Object.entries(json);

    const container = document.getElementById("links");
    const counter = document.getElementById("count");
    const search = document.getElementById("search");

    function render(filter){

        if (!filter) filter = "";

        container.innerHTML = "";

        const list = entries.filter(function(item){
            var key = item[0];
            var value = item[1];
            var text = (key + " " + value.url).toLowerCase();
            return text.indexOf(filter.toLowerCase()) !== -1;
        });

        counter.textContent = list.length + " קישורים";

        list.sort(function(a, b){
            return a[0].localeCompare(b[0]);
        });

        for (var i = 0; i < list.length; i++){

            var key = list[i][0];
            var value = list[i][1];

            var shortPath = "/links/" + key;
            var shortUrl = location.origin + shortPath;

            var card = document.createElement("div");
            card.className = "card";

            // קישור מקוצר
            var pShort = document.createElement("p");
            pShort.innerHTML = "<strong>קישור מקוצר</strong><br>";
            var spanShort = document.createElement("span");
            spanShort.textContent = shortUrl;
            pShort.appendChild(spanShort);
            card.appendChild(pShort);

            // יעד
            var pTarget = document.createElement("p");
            pTarget.innerHTML = "<strong>יעד</strong><br>";
            var spanTarget = document.createElement("span");
            spanTarget.textContent = value.url;
            pTarget.appendChild(spanTarget);
            card.appendChild(pTarget);

            // כפתורים
            var actions = document.createElement("div");
            actions.className = "card-actions";

            // פתח קישור
            var btnShort = document.createElement("a");
            btnShort.className = "btn-link btn-primary";
            btnShort.href = shortUrl;
            btnShort.target = "_blank";
            btnShort.textContent = "🔗 פתח קישור";
            actions.appendChild(btnShort);

            // פתח יעד
            var btnTarget = document.createElement("a");
            btnTarget.className = "btn-link btn-primary";
            btnTarget.href = value.url;
            btnTarget.target = "_blank";
            btnTarget.textContent = "🌐 פתח יעד";
            actions.appendChild(btnTarget);

            // העתק מקוצר
            var btnCopyShort = document.createElement("a");
            btnCopyShort.className = "btn-link btn-secondary";
            btnCopyShort.href = "#";
            btnCopyShort.textContent = "📋 העתק מקוצר";
            btnCopyShort.onclick = (function(url){
                return function(e){
                    e.preventDefault();
                    navigator.clipboard.writeText(url);
                    showToast("הקישור המקוצר הועתק");
                };
            })(shortUrl);
            actions.appendChild(btnCopyShort);

            // העתק יעד
            var btnCopy = document.createElement("a");
            btnCopy.className = "btn-link btn-secondary";
            btnCopy.href = "#";
            btnCopy.textContent = "📋 העתק יעד";
            btnCopy.onclick = (function(url){
                return function(e){
                    e.preventDefault();
                    navigator.clipboard.writeText(url);
                    showToast("היעד הועתק");
                };
            })(value.url);
            actions.appendChild(btnCopy);

            card.appendChild(actions);
            container.appendChild(card);
        }
    }

    search.oninput = function(){
        render(search.value);
    };

    render();
}

function showToast(text){
    var toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(function(){
        toast.classList.remove("show");
    }, 1500);
}

loadLinks();

</script>

</body>
</html>
