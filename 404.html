<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפנה...</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#eee;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:20px;box-sizing:border-box}
  .box{text-align:center;max-width:340px}
  .spinner{width:36px;height:36px;border:4px solid #333;border-top-color:#4ea1ff;
           border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:#4ea1ff}
  input{font-size:16px;padding:8px 10px;border-radius:6px;border:1px solid #444;
        background:#222;color:#eee;width:100%;box-sizing:border-box;margin-top:12px}
  button{margin-top:10px;padding:8px 16px;border-radius:6px;border:none;
         background:#2563eb;color:#fff;font-size:14px;cursor:pointer}
  .err{color:#f87171;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div id="msg">מפנה אותך...</div>
  <div id="pwBox" style="display:none">
    <input type="password" id="pwInput" placeholder="הזן סיסמה">
    <button onclick="checkPassword()">המשך</button>
    <div id="pwErr" class="err"></div>
  </div>
</div>

<script>
// ===== הגדרה =====
const REPO_BASE = "/links/";
// חייב להיות זהה לקידומת ב-admin.html
const COUNTER_PREFIX = "sh770links_";
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1/";

let currentLink = null;
let currentSlug = null;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function getSlug() {
  let path = location.pathname;
  if (REPO_BASE && path.startsWith(REPO_BASE)) {
    path = path.slice(REPO_BASE.length);
  } else {
    path = path.replace(/^\//, "");
  }
  return decodeURIComponent(path.replace(/\/$/, ""));
}

async function getClickCount(slug) {
  try {
    const res = await fetch(COUNTER_API + "get/" + encodeURIComponent(COUNTER_PREFIX + slug));
    if (!res.ok) return 0;
    const data = await res.json();
    return parseInt(data.value || "0", 10);
  } catch (e) {
    return 0;
  }
}

async function getCountry() {
  try {
    const res = await fetch("https://api.country.is/");
    if (!res.ok) return null;
    const data = await res.json();
    return data.country || null; // קוד מדינה בן 2 אותיות, למשל "IL"
  } catch (e) {
    return null; // כישלון בזיהוי - לא נחסום (fail-open), ראה README
  }
}

async function hitAndRedirect() {
  document.getElementById("spinner").style.display = "block";
  document.getElementById("msg").textContent = "מפנה אותך...";
  document.getElementById("pwBox").style.display = "none";
  try {
    await Promise.race([
      fetch(COUNTER_API + "hit/" + encodeURIComponent(COUNTER_PREFIX + currentSlug)),
      new Promise(res => setTimeout(res, 400))
    ]);
  } catch (e) {}
  location.replace(currentLink.url);
}

async function checkPassword() {
  const val = document.getElementById("pwInput").value;
  const hash = await sha256(val);
  if (hash === currentLink.passwordHash) {
    hitAndRedirect();
  } else {
    document.getElementById("pwErr").textContent = "סיסמה שגויה.";
  }
}

async function redirect() {
  const slug = getSlug();
  currentSlug = slug;

  if (!slug) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").innerHTML = "לא צוין קישור.";
    return;
  }

  let links;
  try {
    const base = REPO_BASE || "/";
    const res = await fetch(base + "links.json?_=" + Date.now());
    links = await res.json();
  } catch (e) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").innerHTML = "שגיאה בטעינת מסד הקישורים.";
    return;
  }

  const link = links[slug];
  const base = REPO_BASE || "/";
  if (!link) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").innerHTML =
      'הקישור <b>' + slug + '</b> לא נמצא.<br><a href="' + base + '">חזרה לדף הבית</a>';
    return;
  }
  currentLink = link;

  if (link.maxClicks) {
    const count = await getClickCount(slug);
    if (count >= link.maxClicks) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("msg").innerHTML =
        'הקישור <b>' + slug + '</b> פג תוקף (הגיע למספר הכניסות המותר).<br><a href="' + base + '">חזרה לדף הבית</a>';
      return;
    }
  }

  if (link.allowedCountries && link.allowedCountries.length) {
    const country = await getCountry();
    if (country && !link.allowedCountries.includes(country)) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("msg").innerHTML =
        'הקישור <b>' + slug + '</b> אינו זמין באזור שלך.<br><a href="' + base + '">חזרה לדף הבית</a>';
      return;
    }
    // אם הזיהוי נכשל (country === null) - ממשיכים בלי חסימה
  }

  if (link.passwordHash) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").textContent = "הקישור הזה מוגן בסיסמה.";
    document.getElementById("pwBox").style.display = "block";
    return;
  }

  hitAndRedirect();
}
redirect();
</script>
</body>
</html>
