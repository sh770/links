<script>
  // ===== הגדרה =====
  // נתיב הבסיס מזוהה אוטומטית לפי הכתובת שבה הדף רץ - לא צריך לערוך
  // את זה ידנית, גם אם תחבר בעתיד דומיין מותאם (Cloudflare וכו').
  // ב-username.github.io/reponame/... הנתיב הוא "/reponame/".
  // בדומיין מותאם (לא github.io) האתר תמיד מוגש מהשורש, אז "/".
  function getBasePath() {
    if (location.hostname.endsWith(".github.io")) {
      const parts = location.pathname.split("/").filter(Boolean);
      return parts.length ? ("/" + parts[0] + "/") : "/";
    }
    return "/";
  }
  const REPO_BASE = getBasePath();
  // חייב להיות זהה לקידומת ב-admin.html
  const COUNTER_PREFIX = "sh770links_";

  // טוען את style.css מהנתיב הנכון (לא ניתן להשתמש ב-<link> קבוע כי
  // דף 404 מוגש עבור כתובות שונות, אז הנתיב היחסי לא תמיד נכון)
  document.write('<link rel="stylesheet" href="' + (REPO_BASE || "/") + 'style.css">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.svg" type="image/svg+xml">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.ico" sizes="32x32">');
</script>

<script>
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1/";

let currentLink = null;
let currentSlug = null;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// מונע הזרקת HTML/JS דרך הכינוי (שמגיע ישירות מה-URL, ולכן לא אמין) -
// בלי זה, קישור מעוצב בזדון היה יכול להריץ קוד בדפדפן של כל מבקר.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function getSlug() {
  let path = location.pathname;
  if (REPO_BASE && path.startsWith(REPO_BASE)) {
    path = path.slice(REPO_BASE.length);
  } else {
    path = path.replace(/^\//, "");
  }
  return decodeURIComponent(path.replace(/\/$/, ""));
}

async function getClickCount(slug) {
  try {
    const res = await fetch(COUNTER_API + "get/" + encodeURIComponent(COUNTER_PREFIX + slug));
    if (!res.ok) return 0;
    const data = await res.json();
    return parseInt(data.value || "0", 10);
  } catch (e) {
    return 0;
  }
}

async function hitAndRedirect() {
  try {
    await Promise.race([
      fetch(COUNTER_API + "hit/" + encodeURIComponent(COUNTER_PREFIX + currentSlug)),
      new Promise(res => setTimeout(res, 400))
    ]);
  } catch (e) {}
  location.replace(currentLink.url);
}

  if (hash === currentLink.passwordHash) {
    hitAndRedirect();
  } else {
    document.getElementById("pwErr").textContent = "סיסמה שגויה.";
  }
}
