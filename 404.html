<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפנה...</title>
<script>
  // ===== הגדרה =====
  // נתיב הבסיס מזוהה אוטומטית לפי הכתובת שבה הדף רץ - לא צריך לערוך
  // את זה ידנית, גם אם תחבר בעתיד דומיין מותאם (Cloudflare וכו').
  // ב-username.github.io/reponame/... הנתיב הוא "/reponame/".
  // בדומיין מותאם (לא github.io) האתר תמיד מוגש מהשורש, אז "/".
  function getBasePath() {
    if (location.hostname.endsWith(".github.io")) {
      const parts = location.pathname.split("/").filter(Boolean);
      return parts.length ? ("/" + parts[0] + "/") : "/";
    }
    return "/";
  }
  const REPO_BASE = getBasePath();
  // חייב להיות זהה לקידומת ב-admin.html
  const COUNTER_PREFIX = "sh770links_";

  // טוען את style.css מהנתיב הנכון (לא ניתן להשתמש ב-<link> קבוע כי
  // דף 404 מוגש עבור כתובות שונות, אז הנתיב היחסי לא תמיד נכון)
  document.write('<link rel="stylesheet" href="' + (REPO_BASE || "/") + 'style.css?v=20261112-4">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.svg" type="image/svg+xml">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.ico" sizes="32x32">');
</script>
</head>
<body>
<div class="center-page">
  <div class="box" id="box" style="display:none">
    <div class="spinner" id="spinner" style="display:none"></div>
    <div id="msg"></div>
    <div id="pwBox" style="display:none">
      <input type="password" id="pwInput" placeholder="הזן סיסמה" style="margin-top:12px">
      <button onclick="checkPassword()">המשך</button>
      <div id="pwErr" class="msg err"></div>
    </div>
  </div>
</div>

<script>
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1/";

let currentLink = null;
let currentSlug = null;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// מונע הזרקת HTML/JS דרך הכינוי (שמגיע ישירות מה-URL, ולכן לא אמין) -
// בלי זה, קישור מעוצב בזדון היה יכול להריץ קוד בדפדפן של כל מבקר.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function getSlug() {
  let path = location.pathname;
  if (REPO_BASE && path.startsWith(REPO_BASE)) {
    path = path.slice(REPO_BASE.length);
  } else {
    path = path.replace(/^\//, "");
  }
  path = path.replace(/\/$/, "");
  try {
    return decodeURIComponent(path);
  } catch (e) {
    return path; // כתובת עם קידוד פגום - לא קורסים, פשוט לא יימצא כינוי כזה
  }
}

// כתובת יעד חייבת להיות http/https בלבד - חוסם javascript:, data: וכד'
function isSafeUrl(u) {
  try {
    const p = new URL(u).protocol;
    return p === "http:" || p === "https:";
  } catch (e) {
    return false;
  }
}

async function getClickCount(slug) {
  try {
    const res = await fetch(COUNTER_API + "get/" + encodeURIComponent(COUNTER_PREFIX + slug));
    if (!res.ok) return 0;
    const data = await res.json();
    return parseInt(data.value || "0", 10);
  } catch (e) {
    return 0;
  }
}

async function hitAndRedirect() {
  try {
    await Promise.race([
      fetch(COUNTER_API + "hit/" + encodeURIComponent(COUNTER_PREFIX + currentSlug)),
      new Promise(res => setTimeout(res, 400))
    ]);
  } catch (e) {}
  location.replace(currentLink.url);
}

async function checkPassword() {
  const val = document.getElementById("pwInput").value;
  const hash = await sha256(val);
  if (hash === currentLink.passwordHash) {
    hitAndRedirect();
  } else {
    document.getElementById("pwErr").textContent = "סיסמה שגויה.";
  }
}

function showDeadEnd(html) {
  // מציגים את הודעת החסימה ונשארים בדף ללא הפניה אוטומטית.
  document.getElementById("box").style.display = "block";
  document.getElementById("msg").innerHTML =
    '<h1>הקישור חסום כרגע</h1><p>' + html + '</p>';
}

// בודק אם הקישור נמצא מחוץ לחלון הפעילות לפי שעון ישראל.
function getScheduleBlockMessage(schedule) {
  if (!schedule) return "";
  const now = new Date();
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Jerusalem", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23"
  }).formatToParts(now);
  const part = type => parts.find(item => item.type === type)?.value || "";
  const today = part("year") + "-" + part("month") + "-" + part("day");
  const currentTime = part("hour") + ":" + part("minute");
  const dayNumber = ({Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6})[part("weekday")];

  if (schedule.startDate && today < schedule.startDate) return "הקישור עדיין לא פעיל. הוא יהיה זמין החל מתאריך " + schedule.startDate + ".";
  if (schedule.endDate && today > schedule.endDate) return "תוקף הקישור פג בתאריך " + schedule.endDate + ".";
  const dayNames = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const activeDays = Array.isArray(schedule.days) && schedule.days.length
    ? schedule.days.map(day => dayNames[day]).filter(Boolean).map(day => "יום " + day).join(", ")
    : "";
  const activeHours = schedule.startTime && schedule.endTime
    ? " בין השעות " + schedule.startTime + "–" + schedule.endTime
    : "";
  if (Array.isArray(schedule.days) && schedule.days.length && !schedule.days.includes(dayNumber)) {
    return "הקישור אינו פעיל היום. ניתן להיכנס ב" + activeDays + activeHours + " (שעון ישראל).";
  }
  if (schedule.startTime && schedule.endTime && currentTime < schedule.startTime) {
    return "הקישור עדיין לא פעיל היום. אפשר להיכנס החל מהשעה " + schedule.startTime + " (שעון ישראל).";
  }
  if (schedule.startTime && schedule.endTime && currentTime >= schedule.endTime) {
    return "שעות הפעילות להיום הסתיימו. ניתן להיכנס ב" +
      (activeDays || "ימי הפעילות המוגדרים") + activeHours + " (שעון ישראל).";
  }
  return "";
}

async function redirect() {
  const slug = getSlug();
  currentSlug = slug;
  const base = REPO_BASE || "/";

  if (!slug) {
    showDeadEnd("לא צוין קישור.");
    return;
  }

  let links;
  try {
    const res = await fetch(base + "links.json?_=" + Date.now());
    links = await res.json();
  } catch (e) {
    document.getElementById("box").style.display = "block";
    document.getElementById("msg").textContent = "שגיאה בטעינת מסד הקישורים.";
    return;
  }

  // התאמה מדויקת קודם; אם אין - התאמה בלי הבחנה בין אותיות גדולות/קטנות.
  // (hasOwnProperty כדי ש"constructor" וכד' לא ייחשבו בטעות כינוי קיים)
  const has = k => Object.prototype.hasOwnProperty.call(links, k);
  const key = has(slug) ? slug : Object.keys(links).find(k => k.toLowerCase() === slug.toLowerCase());
  const link = key !== undefined ? links[key] : undefined;
  if (!link) {
    showDeadEnd('הקישור <b>' + escapeHtml(slug) + '</b> לא נמצא.');
    return;
  }
  currentSlug = key; // מפתח הספירה נקבע לפי הכינוי האמיתי, לא לפי האותיות שהוקלדו
  currentLink = link;

  if (!isSafeUrl(link.url)) {
    showDeadEnd('היעד של הקישור <b>' + escapeHtml(slug) + '</b> אינו תקין.');
    return;
  }

  const scheduleMessage = getScheduleBlockMessage(link.schedule);
  if (scheduleMessage) {
    showDeadEnd(escapeHtml(scheduleMessage));
    return;
  }

  if (link.maxClicks) {
    const count = await getClickCount(key);
    if (count >= link.maxClicks) {
      showDeadEnd('הקישור <b>' + escapeHtml(slug) + '</b> פג תוקף (הגיע למספר הכניסות המותר).');
      return;
    }
  }

  if (link.passwordHash) {
    document.getElementById("box").style.display = "block";
    document.getElementById("msg").textContent = "הקישור הזה מוגן בסיסמה.";
    document.getElementById("pwBox").style.display = "block";
    return;
  }

  hitAndRedirect();
}
// Enter בשדה הסיסמה שולח אותה
document.getElementById("pwInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

redirect();
</script>
</body>
</html>
