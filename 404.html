<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפנה...</title>
<script>
  // ===== הגדרה =====
  const REPO_BASE = "/links/";
  // חייב להיות זהה לקידומת ב-admin.html
  const COUNTER_PREFIX = "sh770links_";

  // טוען את style.css מהנתיב הנכון (לא ניתן להשתמש ב-<link> קבוע כי
  // דף 404 מוגש עבור כתובות שונות, אז הנתיב היחסי לא תמיד נכון)
  document.write('<link rel="stylesheet" href="' + (REPO_BASE || "/") + 'style.css">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.svg" type="image/svg+xml">');
  document.write('<link rel="icon" href="' + (REPO_BASE || "/") + 'favicon.ico" sizes="32x32">');
</script>
</head>
<body>
<div class="center-page">
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div id="msg">מפנה אותך...</div>
    <div id="pwBox" style="display:none">
      <input type="password" id="pwInput" placeholder="הזן סיסמה" style="margin-top:12px">
      <button onclick="checkPassword()">המשך</button>
      <div id="pwErr" class="msg err"></div>
    </div>
  </div>
</div>

<script>
const COUNTER_API = "https://countapi.mileshilliard.com/api/v1/";

let currentLink = null;
let currentSlug = null;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function getSlug() {
  let path = location.pathname;
  if (REPO_BASE && path.startsWith(REPO_BASE)) {
    path = path.slice(REPO_BASE.length);
  } else {
    path = path.replace(/^\//, "");
  }
  return decodeURIComponent(path.replace(/\/$/, ""));
}

async function getClickCount(slug) {
  try {
    const res = await fetch(COUNTER_API + "get/" + encodeURIComponent(COUNTER_PREFIX + slug));
    if (!res.ok) return 0;
    const data = await res.json();
    return parseInt(data.value || "0", 10);
  } catch (e) {
    return 0;
  }
}

async function hitAndRedirect() {
  document.getElementById("spinner").style.display = "block";
  document.getElementById("msg").textContent = "מפנה אותך...";
  document.getElementById("pwBox").style.display = "none";
  try {
    await Promise.race([
      fetch(COUNTER_API + "hit/" + encodeURIComponent(COUNTER_PREFIX + currentSlug)),
      new Promise(res => setTimeout(res, 400))
    ]);
  } catch (e) {}
  location.replace(currentLink.url);
}

async function checkPassword() {
  const val = document.getElementById("pwInput").value;
  const hash = await sha256(val);
  if (hash === currentLink.passwordHash) {
    hitAndRedirect();
  } else {
    document.getElementById("pwErr").textContent = "סיסמה שגויה.";
  }
}

function showDeadEnd(html) {
  const base = REPO_BASE || "/";
  document.getElementById("spinner").style.display = "none";
  document.getElementById("msg").innerHTML =
    html + '<div style="margin-top:10px;font-size:13px;color:var(--text-dim)">מעביר אותך לדף הבית בעוד <span id="countdown">3</span>...</div>';
  let seconds = 3;
  const timer = setInterval(() => {
    seconds -= 1;
    const el = document.getElementById("countdown");
    if (el) el.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      location.replace(base);
    }
  }, 1000);
}

async function redirect() {
  const slug = getSlug();
  currentSlug = slug;
  const base = REPO_BASE || "/";

  if (!slug) {
    showDeadEnd("לא צוין קישור.");
    return;
  }

  let links;
  try {
    const res = await fetch(base + "links.json?_=" + Date.now());
    links = await res.json();
  } catch (e) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").innerHTML = "שגיאה בטעינת מסד הקישורים.";
    return;
  }

  const link = links[slug];
  if (!link) {
    showDeadEnd('הקישור <b>' + slug + '</b> לא נמצא.');
    return;
  }
  currentLink = link;

  if (link.maxClicks) {
    const count = await getClickCount(slug);
    if (count >= link.maxClicks) {
      showDeadEnd('הקישור <b>' + slug + '</b> פג תוקף (הגיע למספר הכניסות המותר).');
      return;
    }
  }

  if (link.passwordHash) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").textContent = "הקישור הזה מוגן בסיסמה.";
    document.getElementById("pwBox").style.display = "block";
    return;
  }

  hitAndRedirect();
}
redirect();
</script>
</body>
</html>
